x-app: &app
  build: .
  image: ai-news-intelligence:local
  env_file: ${APP_ENV_FILE:-.env}
  environment:
    # The app builds (and URL-escapes) the connection URL from these; .env's DATABASE_URL
    # (localhost, for host-side Python) is ignored inside containers.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"  # container-internal port, independent of the host mapping
    POSTGRES_USER: ${POSTGRES_USER:-news}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:-news}
    TZ: UTC
    # The embedding model is baked into the image (Dockerfile); never download at runtime.
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    # Own cookie name: browsers share cookies across ports of one host, so the API on the
    # host (ainis_session) and this one would otherwise overwrite each other's sign-in.
    # Set here (the shared block) because an api-only `environment:` would replace it all.
    SESSION_COOKIE_NAME: ainis_session_docker

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-news}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    # No host port here: the API is the only way in. compose.override.yaml publishes
    # the DB on localhost for local development.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts:/ops:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # python:3.12-slim has no curl; liveness only (model_ready is not required).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
