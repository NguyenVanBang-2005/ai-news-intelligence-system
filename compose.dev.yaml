# Local development only, never loaded by a plain `docker compose up` (the file is not
# named compose.override.yaml on purpose). It exposes the DB on localhost so host-side
# Python (tests, alembic) can reach it:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
